# ─────────────────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────────────────
server.port=8080

# ─────────────────────────────────────────────────────────
# Node identity  (ID is derived automatically from host:port)
# ─────────────────────────────────────────────────────────
kv.node.host=localhost
kv.node.port=8080

# ─────────────────────────────────────────────────────────
# Cluster — seed peers (comma-separated host:port)
# Example: kv.cluster.seeds=192.168.1.2:8080,192.168.1.3:8080
# ─────────────────────────────────────────────────────────
kv.cluster.seeds=

# ─────────────────────────────────────────────────────────
# Consistent hash ring — virtual nodes per physical node
# ─────────────────────────────────────────────────────────
kv.ring.virtual-nodes=150

# ─────────────────────────────────────────────────────────
# Replication (N, W, R)  — W + R > N = strong consistency
# ─────────────────────────────────────────────────────────
kv.replication.n=3
kv.replication.w=2
kv.replication.r=2
kv.replication.timeout-ms=3000

# ─────────────────────────────────────────────────────────
# Gossip failure detector
# ─────────────────────────────────────────────────────────
kv.gossip.interval-ms=1000
kv.gossip.timeout-ms=5000
kv.gossip.fanout=3

# ─────────────────────────────────────────────────────────
# Redis (Jedis) — primary persistent store
# Set kv.redis.enabled=false to run local-only (no Redis required)
# ─────────────────────────────────────────────────────────
kv.redis.enabled=true
kv.redis.host=localhost
kv.redis.port=6379
# kv.redis.password=yourpassword
kv.redis.timeout-ms=2000
kv.redis.pool.max-total=20
kv.redis.pool.max-idle=10
kv.redis.pool.min-idle=2

# ─────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────
logging.level.com.example.distributedkvstore=INFO
